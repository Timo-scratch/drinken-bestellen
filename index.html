<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Café Bestellingen</title>
<meta name="theme-color" content="#6a3df0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Café">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:'Figtree';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:800;font-display:swap;src:url('fonts/figtree-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/fredoka-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/fredoka-latin-600-normal.woff2') format('woff2')}
:root{
  --ink:#1d1640; --ink-2:#5f5a7d; --ink-3:#938fb0;
  --paper:#f7f4ff; --card:#ffffff; --line:#e3dcf7; --line-2:#efeafc;
  --violet:#6a3df0; --violet-d:#5128d4; --violet-soft:#ece6ff;
  --pink:#ff5c93; --pink-soft:#ffe6ef;
  --amber:#b45309; --amber-bg:#fef3c7; --amber-bd:#fcd34d;
  --blue:#1d4ed8; --blue-bg:#dbeafe; --blue-bd:#93c5fd;
  --green:#15803d; --green-bg:#dcfce7; --green-bd:#86efac;
  --grey:#57534e; --grey-bg:#f1efee; --grey-bd:#d6d3d1;
  --red:#b91c1c; --red-bg:#fee2e2; --red-bd:#fca5a5; --red-solid:#dc2626;
  --font-display:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:.005em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.15em}
.hidden{display:none!important}
.muted{color:var(--ink-2)}
.center{text-align:center}

/* layout */
.screen{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top)}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 24px}
.wrap-wide{max-width:1040px;margin:0 auto;padding:20px 16px 40px}

/* bunting (the one memorable element) */
.bunting{height:24px;flex:none;position:relative;overflow:hidden}
.bunting::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--ink);opacity:.18}
.bunting i{position:absolute;top:2px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid var(--c);transform-origin:50% 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;flex:none;background:var(--paper)}
.topbar .l{display:flex;align-items:center;gap:8px;min-width:0}
.logo{background:var(--violet);color:#fff;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:18px}
.topbar h1{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);font-size:20px}
.iconbtn:hover{background:var(--violet-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;font-weight:700;border:2px solid transparent;transition:transform .08s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--violet);color:#fff}
.btn-primary:hover{background:var(--violet-d)}
.btn-pink{background:var(--pink);color:#fff}
.btn-out{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-out:hover{border-color:var(--violet);color:var(--violet)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{background:var(--violet-soft)}
.btn-danger{background:var(--red-solid);color:#fff}
.btn-danger-out{background:#fff;border-color:var(--red-bd);color:var(--red)}
.btn-danger-out:hover{background:var(--red-bg)}
.btn-green{background:#16a34a;color:#fff}
.btn-blue{background:#2563eb;color:#fff}
.btn-sm{min-height:34px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn-lg{min-height:50px;font-size:1.05rem;border-radius:14px}
.btn-block{width:100%}
.btn-sq{min-height:32px;width:32px;padding:0;border-radius:9px}

/* inputs */
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-2);margin:0 0 4px 2px}
.input,.select,.textarea{width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:0 14px;min-height:44px;transition:border-color .15s}
.textarea{padding:10px 14px;min-height:110px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--violet)}
.input.err{border-color:var(--red-solid)}
.input.pin{text-align:center;font-size:1.6rem;letter-spacing:.4em;font-family:var(--font-display)}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap-r{flex-wrap:wrap}
.between{justify-content:space-between}

/* cards */
.card{background:var(--card);border:2px solid var(--line-2);border-radius:18px;padding:16px}
.card h3{font-size:1.1rem;margin-bottom:12px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;border:1.5px solid}
.b-pending{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.b-making{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.b-ready{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.b-served{background:var(--grey-bg);color:var(--grey);border-color:var(--grey-bd)}
.b-declined{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1.5px solid}
.pill-ice{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc}
.pill-bub{background:var(--violet-soft);color:var(--violet-d);border-color:#c4b3fa}
.count{background:var(--red-solid);color:#fff;border-radius:999px;font-size:.75rem;font-weight:800;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.count.orange{background:#f97316}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* hero / gate */
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.gate .box{width:100%;max-width:360px;text-align:center}
.gate .big{width:72px;height:72px;border-radius:24px;background:var(--violet);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:34px;transform:rotate(-6deg);box-shadow:5px 5px 0 var(--pink)}
.gate h2{font-size:1.9rem;margin-bottom:8px}
.gate p{color:var(--ink-2);margin-bottom:20px}
.closed .disc{width:120px;height:120px;border-radius:50%;background:var(--violet-soft);display:grid;place-items:center;font-size:52px;margin:0 auto 20px}

/* drinks */
.hello{text-align:center;margin:4px 0 12px}
.hello h2{font-size:1.8rem;color:var(--violet)}
.hello p{font-size:.85rem;color:var(--ink-2);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 6px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.8rem}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.group-title{font-size:.8rem;font-weight:800;color:var(--ink-3);margin:16px 2px 8px}
.group-title.star{color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.drink{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:128px;padding:14px 8px;background:#fff;border:2px solid var(--line);border-radius:20px;text-align:center;transition:transform .1s,border-color .15s,box-shadow .15s}
.drink:hover{border-color:#c4b3fa}
.drink:active{transform:scale(.97)}
.drink .em{width:52px;height:52px;border-radius:50%;background:var(--violet-soft);display:grid;place-items:center;font-size:28px;transition:transform .2s}
.drink:hover .em{transform:translateY(-3px) rotate(-6deg)}
.drink .nm{font-weight:700;font-size:.95rem;line-height:1.2}
.drink .pr{font-size:.72rem;font-weight:800;background:var(--pink-soft);color:#c2185b;border-radius:999px;padding:1px 9px}
.drink.sel{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft),4px 4px 0 var(--violet)}
.drink.sel .em{background:var(--violet);}
.drink .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:12px}

/* basket bar */
.bar{flex:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line-2);display:flex;justify-content:center}
.bar .btn{min-width:220px}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(29,22,64,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.backdrop.side{padding:0;justify-content:flex-start;align-items:stretch}
@keyframes fade{from{opacity:0}}
.anim .backdrop{animation:fade .15s}
.anim .modal{animation:rise .2s ease-out}
.anim .drawer{animation:slide .2s ease-out}
.drawer{width:290px;max-width:85vw;background:var(--paper);height:100%;display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(29,22,64,.25)}
@keyframes slide{from{transform:translateX(-100%)}}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:2px solid var(--line-2)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px}
.menu-item:hover{background:var(--violet-soft)}
.menu-item .mi{width:36px;height:36px;border-radius:11px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;flex:none;font-size:18px}
.menu-item b{display:block;font-size:.92rem}
.menu-item small{color:var(--ink-2);font-size:.76rem}

/* modal */
.modal{background:#fff;border-radius:22px;width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(29,22,64,.35)}
.modal.wide{max-width:460px}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.modal h3{font-size:1.3rem;margin-bottom:4px}
.modal .x{float:right;margin:-6px -8px 0 0}
.modal.alertbox{padding:0;overflow:hidden;border:3px solid var(--red-bd)}
.alertbox .hd{background:var(--red-solid);color:#fff;padding:18px 20px;display:flex;gap:12px;align-items:center}
.alertbox .hd small{display:block;font-size:.72rem;font-weight:700;opacity:.85}
.alertbox .hd h3{margin:0;font-size:1.5rem}
.alertbox .bd{padding:20px}
.reason{background:var(--red-bg);border:2px solid var(--red-bd);border-radius:14px;padding:12px 14px;margin:12px 0}
.reason small{display:block;font-size:.72rem;font-weight:800;color:var(--red)}
.reason p{color:#7f1d1d;font-weight:700}

/* option tiles */
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink-2)}
.tile .big{font-size:28px;line-height:1}
.tile b{color:var(--ink);font-size:.9rem}
.tile small{font-size:.72rem}
.tile.on.ice{border-color:#38bdf8;background:#f0f9ff}
.tile.on.bub{border-color:var(--violet);background:var(--violet-soft)}
.tile.locked{cursor:default}
.tile .lk{position:absolute;top:8px;right:8px;font-size:12px;color:var(--ink-3)}

/* track */
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:20px}
.search .input{padding-left:44px;min-height:54px;font-size:1.05rem;border-radius:16px}
.order{display:flex;gap:12px;background:#fff;border:2px solid var(--line-2);border-radius:18px;padding:14px}
.order.dec{opacity:.8;padding:10px 14px}
.order .em{width:44px;height:44px;border-radius:14px;background:var(--violet-soft);display:grid;place-items:center;font-size:22px;flex:none}
.order h3{font-size:1.1rem}
.order .note{color:var(--violet-d);font-style:italic;font-weight:600;font-size:.9rem;margin-top:2px}
.order .meta{font-size:.75rem;color:var(--ink-3);margin-top:3px}
.empty{text-align:center;padding:40px 20px;border:2px dashed var(--line);border-radius:22px;color:var(--ink-2)}
.empty .e{font-size:40px;margin-bottom:6px}
.empty h3{color:var(--ink);margin-bottom:4px}

/* staff */
.s-head{background:#fff;border-bottom:2px solid var(--line-2);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;flex:none}
.s-head h1{font-size:1.3rem;cursor:pointer}
.ocards{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.ocards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.ocards{grid-template-columns:repeat(3,1fr)}}
.ocard{background:#fff;border:2px solid var(--line-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ocard.dec{padding:12px;gap:8px;opacity:.82}
.ocard .mid{border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);padding:10px 0}
.ocard .nt{margin-top:8px;font-size:.88rem;background:var(--paper);border-radius:10px;padding:8px 10px;font-style:italic;color:var(--ink-2)}
.mono{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.75rem}
.sgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.sgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.sgrid{grid-template-columns:repeat(3,1fr)}}
.sec-title{font-size:1.6rem;margin:28px 0 12px}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;border-radius:10px;border:2px solid var(--line);padding:5px 10px;background:#fff;color:var(--ink-3)}
.mode.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.mode.locked{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.drow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;border:2px solid var(--line-2);background:#fff;position:relative}
.drow .grip{touch-action:none;cursor:grab;color:var(--ink-3);padding:6px 4px;border-radius:8px;font-size:18px}
.drow .grip:hover{background:var(--violet-soft)}
.drow.dragging{z-index:5;box-shadow:0 12px 30px rgba(29,22,64,.25);border-color:var(--violet);background:#fff;transition:none!important}
.drow:not(.dragging){transition:transform .15s}
.drow .dn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.drow .dn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pricebtn{display:inline-flex;align-items:center;gap:2px;font-size:.78rem;font-weight:800;border-radius:9px;border:2px solid var(--line);padding:4px 9px;background:#fff;color:var(--ink-3)}
.pricebtn.has{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.priceedit{width:78px;border:2px solid var(--violet);border-radius:9px;padding:4px 8px;font-weight:700;font-size:.85rem}
.dlist{display:grid;gap:8px}
.fb{border:2px solid var(--line-2);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.fb.unread{border-color:#c4b3fa;background:#fff}
.fb.read{opacity:.6;background:var(--paper)}
.fb.help.unread{border-color:#fdba74;background:#fff7ed}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;color:var(--ink-3);padding:6px 8px 6px 0;border-bottom:2px solid var(--line-2)}
.tbl td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line-2)}
.tbl .r{text-align:right}
.sum{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--paper);font-weight:700;font-size:.9rem}
.sum.total{background:var(--green-bg);color:var(--green)}
.sum.pay{background:var(--violet-soft);color:var(--violet-d)}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login .card{max-width:380px;width:100%;padding:28px}

/* rooms */
.rooms{display:grid;gap:12px}
.room{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;transition:transform .1s,border-color .15s}
.room:hover{border-color:#c4b3fa}.room:active{transform:scale(.98)}
.room .num{width:48px;height:48px;border-radius:16px;background:var(--violet);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:1.5rem;font-weight:600;box-shadow:3px 3px 0 var(--pink);flex:none}
.room .rt{flex:1;min-width:0}.room .rt b{display:block;font-family:var(--font-display);font-size:1.15rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .rt small{color:var(--ink-2);font-size:.8rem}
.secret{position:fixed;right:0;bottom:0;width:64px;height:64px;opacity:0;background:transparent;z-index:5}
.secret.in-drawer{position:absolute;width:56px;height:56px}
.drawer{position:relative}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--violet);flex:none}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:12px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s}
.toast b{display:block}
.toast span{font-size:.85rem;opacity:.85}
.toast.bad{background:var(--red-solid)}

/* watch */
.watch-page{min-height:100dvh;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif}
.watch-fixed{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.bezel{padding:12px;border-radius:50%;background:linear-gradient(160deg,#2c2c2c,#181818);box-shadow:0 0 0 1px #111,0 0 0 3px #2a2a2a,0 24px 80px rgba(0,0,0,.9),inset 0 1px 0 #444}
.face{width:360px;height:360px;border-radius:50%;overflow:hidden;background:#000;position:relative;color:#fff}
.watch-fixed .face{transform:scale(calc(100vmin / 360px));transform-origin:center}
.face .abs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.face button{color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:5px 6px}

<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   1. DATABASE-LAAG
   ----------------------------------------------------------------
   Alle gegevens staan in Supabase en lopen via het object `DB`.
   ════════════════════════════════════════════════════════════════ */
/* ── Verbinding met Supabase (pas dit aan als je project verandert) ── */
const SUPABASE_URL = 'https://lgysewiliaxlqrzeizts.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3ecVyHum4ZfYIcmcHGbyPQ_yu_Isc0N';

async function sb(path, {method = 'GET', body, single = false} = {}) {
  const headers = {apikey:SUPABASE_KEY, 'Content-Type':'application/json'};
  if (method !== 'GET') headers.Prefer = 'return=representation';
  let res;
  try { res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method, headers, body:body ? JSON.stringify(body) : undefined}); }
  catch { throw new Error('Geen verbinding met de database. Controleer je internet.'); }
  if (res.status === 404) throw new Error('De database is nog niet bijgewerkt. Voer het SQL-script uit in Supabase.');
  if (!res.ok) {
    let msg = ''; try { msg = (await res.json()).message || ''; } catch {}
    throw new Error(msg || `Databasefout (${res.status})`);
  }
  const text = await res.text();
  const data = text ? JSON.parse(text) : [];
  return single ? data[0] : data;
}

const enc = encodeURIComponent;
const DB = (() => {
  const now = () => new Date().toISOString();
  const mapOrder = r => ({id:r.id, customerName:r.customer_name, drink:r.drink, status:r.status, notes:r.notes, deviceId:r.device_id,
    withIce:r.with_ice, withBubbles:r.with_bubbles, declineReason:r.decline_reason, createdAt:r.created_at});
  const mapDrink = r => ({id:r.id, name:r.name, icon:r.icon, iceAvailable:r.ice_available, bubblesAvailable:r.bubbles_available,
    sortOrder:r.sort_order, priceInCents:r.price_in_cents, createdAt:r.created_at});
  const CFG_COLS = 'id,cafe_name,multi_drink_mode,ordering_open,locked,require_approval,session_start,session_end,host_name';
  const REQ_COLS = 'id,first_name,email,start_at,end_at,require_approval,device_id,status,applied,created_at';
  const mapConfig = r => ({id:r.id, cafeName:r.cafe_name, multiDrinkMode:r.multi_drink_mode, orderingOpen:r.ordering_open,
    locked:!!r.locked, requireApproval:!!r.require_approval, sessionStart:r.session_start || null, sessionEnd:r.session_end || null, hostName:r.host_name || null});
  const mapFeed = r => ({id:r.id, content:r.content, read:r.read_at, createdAt:r.created_at});
  const mapHelp = r => ({id:r.id, customerName:r.customer_name, read:r.read_at, createdAt:r.created_at});
  const mapAccess = r => ({id:r.id, personName:r.person_name, deviceId:r.device_id, status:r.status, createdAt:r.created_at});
  const mapReq = r => ({id:r.id, firstName:r.first_name, email:r.email || '', startAt:r.start_at, endAt:r.end_at, requireApproval:!!r.require_approval,
    deviceId:r.device_id, status:r.status, applied:!!r.applied, createdAt:r.created_at});
  const ID = id => `id=eq.${Number(id)}`;

  return {
    /* staff=true: ook feedback, hulpverzoeken en alle toegangsverzoeken · main=true: alle kamer-aanvragen */
    async getSnapshot({staff = false, main = false, deviceId = null} = {}) {
      const dev = deviceId ? enc(deviceId) : '';
      const [cfg, drinks, orders, feedback, help, access, reqs] = await Promise.all([
        sb(`config?id=eq.1&select=${CFG_COLS}`),
        sb('drinks?select=*&order=sort_order.asc,id.asc'),
        sb('orders?select=*&order=id.asc'),
        staff ? sb('feedback?select=*&order=id.asc') : [],
        staff ? sb('help_requests?select=*&order=id.asc') : [],
        staff ? sb('room_access?select=*&order=id.asc') : (dev ? sb(`room_access?device_id=eq.${dev}&select=*&order=id.asc`) : []),
        main ? sb(`room_requests?select=${REQ_COLS}&order=id.asc`) : (dev ? sb(`room_requests?device_id=eq.${dev}&select=${REQ_COLS}&order=id.asc`) : []),
      ]);
      if (!cfg.length) throw new Error('Tabel "config" is leeg. Voer het SQL-script uit in Supabase.');
      return {config:mapConfig(cfg[0]), drinks:drinks.map(mapDrink), orders:orders.map(mapOrder), feedback:feedback.map(mapFeed),
        helpRequests:help.map(mapHelp), access:access.map(mapAccess), roomRequests:reqs.map(mapReq)};
    },

    /* ── bestellingen ── */
    async createOrder({customerName, drink, notes, deviceId, withIce, withBubbles}) {
      const name = String(customerName || '').trim();
      if (!name) throw new Error('Voer eerst je naam in.');
      return mapOrder(await sb('orders', {method:'POST', single:true, body:{
        customer_name:name, drink, status:'pending', notes:(notes || '').trim() || null,
        device_id:deviceId || null, with_ice:!!withIce, with_bubbles:!!withBubbles}}));
    },
    async updateOrder(id, patch) {
      const b = {};
      if ('drink' in patch) b.drink = patch.drink;
      if ('notes' in patch) b.notes = (patch.notes || '').trim() || null;
      if ('withIce' in patch) b.with_ice = !!patch.withIce;
      if ('withBubbles' in patch) b.with_bubbles = !!patch.withBubbles;
      const r = await sb(`orders?${ID(id)}`, {method:'PATCH', body:b});
      if (!r.length) throw new Error('Bestelling niet gevonden.');
      return mapOrder(r[0]);
    },
    async updateOrderStatus(id, status, declineReason) {
      const r = await sb(`orders?${ID(id)}`, {method:'PATCH', body:{status, decline_reason:status === 'declined' ? ((declineReason || '').trim() || null) : null}});
      if (!r.length) throw new Error('Bestelling niet gevonden.');
      return mapOrder(r[0]);
    },
    async deleteOrder(id) { await sb(`orders?${ID(id)}`, {method:'DELETE'}); },
    async clearAllOrders() { await sb('orders?id=gt.0', {method:'DELETE'}); },

    /* ── drankjes ── */
    async createDrink({name, icon, iceAvailable, bubblesAvailable}) {
      const n = String(name || '').trim();
      if (!n) throw new Error('Geef het drankje een naam.');
      const existing = await sb('drinks?select=name,sort_order');
      if (existing.some(x => x.name.toLowerCase() === n.toLowerCase())) throw new Error('Dit drankje bestaat al.');
      const max = existing.reduce((m, x) => Math.max(m, x.sort_order), -1);
      return mapDrink(await sb('drinks', {method:'POST', single:true, body:{
        name:n, icon:icon || 'CupSoda', ice_available:iceAvailable || 'on', bubbles_available:bubblesAvailable || 'on', sort_order:max + 1}}));
    },
    async updateDrink(id, patch) {
      const b = {};
      if ('iceAvailable' in patch) b.ice_available = patch.iceAvailable;
      if ('bubblesAvailable' in patch) b.bubbles_available = patch.bubblesAvailable;
      if ('priceInCents' in patch) b.price_in_cents = patch.priceInCents;
      const r = await sb(`drinks?${ID(id)}`, {method:'PATCH', body:b});
      if (!r.length) throw new Error('Drankje niet gevonden.');
      return mapDrink(r[0]);
    },
    async reorderDrinks(ids) { await Promise.all(ids.map((id, i) => sb(`drinks?${ID(id)}`, {method:'PATCH', body:{sort_order:i}}))); },
    async deleteDrink(id) { await sb(`drinks?${ID(id)}`, {method:'DELETE'}); },

    /* ── kamer-instellingen (standaard: de huidige kamer) ── */
    async updateConfig(patch) {
      const b = {};
      if ('cafeName' in patch) {
        const n = String(patch.cafeName || '').trim(); if (!n) throw new Error('Geef het café een naam.');
        b.cafe_name = n;
      }
      if ('staffCode' in patch) {   // wordt alleen geschreven, nooit teruggelezen
        if (!/^\d{4}$/.test(patch.staffCode)) throw new Error('De code moet uit 4 cijfers bestaan.');
        b.staff_code = patch.staffCode;
      }
      if ('multiDrinkMode' in patch) b.multi_drink_mode = patch.multiDrinkMode;
      if ('orderingOpen' in patch) b.ordering_open = !!patch.orderingOpen;
      if ('locked' in patch) b.locked = !!patch.locked;
      if ('requireApproval' in patch) b.require_approval = !!patch.requireApproval;
      if ('sessionStart' in patch) b.session_start = patch.sessionStart;
      if ('sessionEnd' in patch) b.session_end = patch.sessionEnd;
      if ('hostName' in patch) b.host_name = patch.hostName;
      return mapConfig((await sb(`config?id=eq.1&select=${CFG_COLS}`, {method:'PATCH', body:b}))[0]);
    },
    async clearRoomData() {
      await Promise.all(['orders', 'feedback', 'help_requests', 'room_access'].map(t => sb(`${t}?id=gt.0`, {method:'DELETE'})));
    },

    /* ── feedback & hulpverzoeken ── */
    async createFeedback(content) {
      const c = String(content || '').trim(); if (!c) throw new Error('Schrijf eerst je feedback.');
      await sb('feedback', {method:'POST', body:{content:c}});
    },
    async markFeedbackRead(id) { await sb(`feedback?${ID(id)}`, {method:'PATCH', body:{read_at:now()}}); },
    async deleteFeedback(id) { await sb(`feedback?${ID(id)}`, {method:'DELETE'}); },
    async createHelpRequest(customerName) {
      const n = String(customerName || '').trim(); if (!n) throw new Error('Voer je naam in.');
      await sb('help_requests', {method:'POST', body:{customer_name:n}});
    },
    async markHelpRead(id) { await sb(`help_requests?${ID(id)}`, {method:'PATCH', body:{read_at:now()}}); },
    async deleteHelp(id) { await sb(`help_requests?${ID(id)}`, {method:'DELETE'}); },

    /* ── toegang tot een kamer (goedkeuring van nieuwe bezoekers) ── */
    async createAccess(personName, deviceId) {
      await sb('room_access', {method:'POST', body:{person_name:String(personName).trim(), device_id:deviceId, status:'pending'}});
    },
    async updateAccess(id, status) { await sb(`room_access?${ID(id)}`, {method:'PATCH', body:{status}}); },

    /* ── gratis kamer aanvragen (hoofdadmin) ── */
    async createRoomRequest({firstName, email, code, startAt, endAt, requireApproval, deviceId}) {
      await sb('room_requests?select=id', {method:'POST', body:{first_name:firstName.trim(), email:email.trim(), requested_code:code, start_at:startAt, end_at:endAt,
        require_approval:!!requireApproval, device_id:deviceId, status:'pending'}});
    },
    async updateRoomRequest(id, patch) { await sb(`room_requests?${ID(id)}&select=id`, {method:'PATCH', body:patch}); },
    async deleteRoomRequest(id) { await sb(`room_requests?${ID(id)}&select=id`, {method:'DELETE'}); },
    /* 'Mijn gegevens verwijderen': alles wat bij dit apparaat/deze naam hoort */
    async deleteMyData(deviceId, name) {
      const dev = enc(deviceId), nowIso = enc(new Date().toISOString());
      await Promise.all([
        sb(`orders?device_id=eq.${dev}`, {method:'DELETE'}),
        sb(`room_access?device_id=eq.${dev}`, {method:'DELETE'}),
        sb(`room_requests?device_id=eq.${dev}&status=in.(pending,denied,stopped)&select=id`, {method:'DELETE'}),
        sb(`room_requests?device_id=eq.${dev}&status=eq.approved&end_at=lt.${nowIso}&select=id`, {method:'DELETE'}),
        name ? sb(`help_requests?customer_name=eq.${enc(name)}`, {method:'DELETE'}) : null,
      ]);
    },

    /* ── code vergeten & hoofdcode ── */
    async createCodeRequest() { await sb('code_requests', {method:'POST', body:{}}); },
    /* codes worden op de server gecontroleerd; de app krijgt ze nooit te zien */
    async checkStaffCode(code) { return (await sb('rpc/check_staff_code', {method:'POST', body:{p_code:String(code)}})) === true; },
    async checkMainCode(code) { return (await sb('rpc/check_main_code', {method:'POST', body:{p_code:String(code)}})) === true; },
    async applyDueSessions() { await sb('rpc/apply_due_sessions', {method:'POST', body:{}}); },
    async setMainCode(code) {
      if (!/^.{4,20}$/.test(code)) throw new Error('De hoofdcode moet 4 tot 20 tekens zijn.');
      await sb('app_settings?id=eq.1&select=id', {method:'PATCH', body:{main_code:code}});
    },
  };
})();

/* ════════════════════════════════════════════════════════════════
   2. HULPFUNCTIES
   ════════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPrice = c => '€' + (c / 100).toFixed(2).replace('.', ',');
const parsePrice = input => {
  const v = parseFloat(String(input).replace(/[€\s]/g, '').replace(',', '.'));
  return isNaN(v) || v < 0 ? 0 : Math.round(v * 100);
};
const LOC = () => S.lang === 'en' ? 'en-GB' : 'nl-NL';
const fmtTime = iso => new Date(iso).toLocaleTimeString(LOC(), {hour:'2-digit', minute:'2-digit'});
const fmtDateTime = iso => new Date(iso).toLocaleString(LOC(), {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const lsJson = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* iconen (inline SVG, geen externe bestanden nodig) */
const P = {

  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  snow:'<path d="M12 2v20M4.9 7l14.2 10M19.1 7 4.9 17M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/>',
};

/* drankjes-iconen: sleutels blijven gelijk aan de oorspronkelijke app (handig voor je database) */

const ICON_NAMES = {Thee:'Thee (Warm/Koud)', Bier:'Bier', Taart:'Taart', Alcoholisch:'Alcoholisch', Suiker:'Suiker', Citrus:'Citrus', Cocktail:'Cocktail & Mocktail', Overig:'Overig', Coffee:'Koffie', CupSoda:'Frisdrank'};

  pending: {label:'In afwachting', icon:'clock', cls:'b-pending'},
  making:  {label:'Wordt gemaakt', icon:'spin',  cls:'b-making'},

const badge = (status, small) => {

const cycleMode = m => m === 'off' ? 'on' : m === 'on' ? 'locked' : 'off';

/* ════════════════════════════════════════════════════════════════
   3. STATUS VAN DE APP
   ════════════════════════════════════════════════════════════════ */
const S = {
  data: null, sig: '',
  route: {path:'/', query:{}}, roomId: 1,
  lang: lsGet('lang') || ((/^nl\b/i.test(navigator.language || '') || Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Amsterdam') ? 'nl' : 'en'),

  editPriceId: null, priceInput: '',
  // horloge
  w: {pin:'', auth:false, code:'', err:false},
};

const SESSION_TTL = 15 * 60 * 1000;
const sessKey = r => 'adminSession_' + r;
function readSession(room = S.roomId) {
  if (!room) return null;
  try {
    const raw = sessionStorage.getItem(sessKey(room)); if (!raw) return null;
    const {code, lastSeen} = JSON.parse(raw);
    if (Date.now() - lastSeen > SESSION_TTL) { sessionStorage.removeItem(sessKey(room)); return null; }
    return code;
  } catch { return null; }
}
const writeSession = (code, room = S.roomId) => sessionStorage.setItem(sessKey(room), JSON.stringify({code, lastSeen:Date.now()}));
const clearSession = (room = S.roomId) => sessionStorage.removeItem(sessKey(room));
const readMain = () => {
  try { const r = sessionStorage.getItem('mainSession'); if (!r) return false;
    if (Date.now() - JSON.parse(r).lastSeen > SESSION_TTL) { sessionStorage.removeItem('mainSession'); return false; } return true; } catch { return false; }
};
const writeMain = () => sessionStorage.setItem('mainSession', JSON.stringify({lastSeen:Date.now()}));
const clearMain = () => sessionStorage.removeItem('mainSession');
const getDeviceId = () => { let d = lsGet('deviceId'); if (!d) { d = uid(); lsSet('deviceId', d); } return d; };

function toast(title, desc = '', bad = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = `<b>${esc(tr(title))}</b>${desc ? `<span>${esc(tr(desc))}</span>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
const fail = e => toast('Dat lukte niet', e && e.message ? e.message : String(e), true);

/* ════════════════════════════════════════════════════════════════

const DICT = {};
const PATTERNS = [];
function trText(s) {
  if (S.lang !== 'en' || !s) return s;
  const m = String(s).match(/^(\s*[^\p{L}\p{N}]*)([\s\S]*?)(\s*)$/u);
  const core = m[2]; if (!core) return s;
  const key = core.replace(/\s+/g, ' ');
  if (Object.prototype.hasOwnProperty.call(DICT, key)) return m[1] + DICT[key] + m[3];
  for (const [re, rep] of PATTERNS) if (re.test(key)) return m[1] + key.replace(re, rep) + m[3];
  return s;
}
const tr = trText;
function translateDom(el) {
  if (S.lang !== 'en' || !el) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) {
    const p = n.parentNode && n.parentNode.tagName;
    if (p === 'TEXTAREA' || p === 'SCRIPT' || p === 'STYLE') continue;
    const v = trText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v;
  }
  el.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e => {
    for (const a of ['placeholder', 'title', 'aria-label']) if (e.hasAttribute(a)) {
      const v = e.getAttribute(a), t = trText(v); if (t !== v) e.setAttribute(a, t);
    }
  });
}

const drinkById = id => S.data.drinks.find(d => d.id === id);
const drinkByName = n => S.data.drinks.find(d => d.name === n);
const myOrders = () => {
  const n = S.name.trim().toLowerCase(); if (n.length < 2) return [];
  return S.data.orders.filter(o => o.customerName.toLowerCase() === n).sort((a,b) => b.id - a.id);
};
const deviceOrders = () => {
  const id = lsGet('deviceId'); if (!id) return [];
  return S.data.orders.filter(o => o.deviceId === id).sort((a,b) => b.id - a.id);
};
const trackOrders = () => {
  const q = S.trackQuery.trim().toLowerCase();
  const list = q.length > 1 ? S.data.orders.filter(o => o.customerName.toLowerCase() === q).sort((a,b) => b.id - a.id) : deviceOrders();
  return [...list].sort((a,b) => Number(a.status === 'declined') - Number(b.status === 'declined'));
};

function bunting() {
  const cols = ['#6a3df0', '#ff5c93', '#ffc233', '#22c1a6', '#4f8bff'];
  let h = '<div class="bunting" aria-hidden="true">';
  for (let i = 0; i < 60; i++) h += `<i style="left:${i * 30 - 6}px;--c:${cols[i % 5]};transform:rotate(${i % 2 ? 4 : -4}deg)"></i>`;
  return h + '</div>';
}

const modal = (inner, {wide = false, cls = '', closable = true} = {}) =>
  `<div class="backdrop" ${closable ? 'data-a="backdrop" data-close="dialog"' : ''}><div class="modal ${wide ? 'wide' : ''} ${cls}" role="dialog" aria-modal="true">${inner}</div></div>`;
const mhead = (title, closable = true) =>
  `${closable ? `<button class="iconbtn x" data-a="closeDialog" aria-label="Sluiten">${ic('x')}</button>` : ''}<h3>${title}</h3>`;

const tile = ({kind, mode, on, onAction, big, label, onText, offText, lockedText}) => {
  const locked = mode === 'locked';
  const active = locked || on;
  return `<button type="button" class="tile ${kind} ${active ? 'on' : ''} ${locked ? 'locked' : ''}" ${locked ? '' : `data-a="${onAction}"`} data-testid="toggle-${kind === 'bub' ? 'bubbles' : kind}">
    ${locked ? `<span class="lk">${ic('lock')}</span>` : ''}
    <span class="big" style="${active ? '' : 'filter:grayscale(1);opacity:.5'}">${big}</span>
    <b>${label}</b>
    <small>${locked ? lockedText : on ? onText : offText}</small>
    ${locked ? '' : '<small style="opacity:.7">Tik om te wisselen</small>'}
  </button>`;
};

function declinedAlertHTML(orders) {
  const o = (orders || []).find(x => x.status === 'declined' && !S.dismissed.has(x.id));
  if (!o) return '';
  return modal(`
    <div class="hd">${ic('xc', '', 'width:40px;height:40px')}
      <div><small>Belangrijke melding</small><h3>Bestelling geweigerd</h3></div></div>
    <div class="bd">
      <p style="font-size:1.05rem">Je bestelling voor <b>${esc(o.drink)}</b> is geweigerd.</p>
      ${o.declineReason ? `<div class="reason"><small>Reden</small><p>${esc(o.declineReason)}</p></div>` : ''}
      <button class="btn btn-danger btn-block btn-lg" data-a="dismissDecline" data-id="${o.id}">Ik heb het gelezen</button>
    </div>`, {closable:false, cls:'alertbox'});
}

  const d = S.dialog; if (!d) return '';
  const cfg = S.data.config;
  switch (d.type) {
    case 'options': {
      const dr = drinkById(d.drinkId); if (!dr) return '';
      const both = dr.iceAvailable !== 'off' && dr.bubblesAvailable !== 'off';
      const multi = cfg.multiDrinkMode === 'on';
      return modal(`${mhead(esc(dr.name))}
        <div class="stack" style="margin-top:8px">
          <p class="muted" style="font-size:.9rem">Pas je drankje aan</p>
          <div class="opts ${both ? '' : 'one'}">
            ${dr.iceAvailable !== 'off' ? tile({kind:'ice', mode:dr.iceAvailable, on:d.ice, onAction:'toggleIce', big:'❄️', label:'IJsblokjes', onText:'Met ijs', offText:'Zonder ijs', lockedText:'Standaard inbegrepen'}) : ''}
            ${dr.bubblesAvailable !== 'off' ? tile({kind:'bub', mode:dr.bubblesAvailable, on:d.bubbles, onAction:'toggleBub', big:'🫧', label:'Bubbels', onText:'Met bubbels', offText:'Zonder bubbels', lockedText:'Standaard inbegrepen'}) : ''}
          </div>
          <button class="btn btn-primary btn-lg btn-block" data-a="optsConfirm" data-testid="button-confirm-options">${multi ? 'Toevoegen aan bestelling' : 'Bestellen'}</button>
        </div>`);
    }
    case 'feedback':
      return modal(`${mhead('Deel je feedback')}
        <div class="stack" style="margin-top:12px">
          <textarea id="feedbackText" class="textarea" data-m="feedbackText" placeholder="Heb je suggesties voor nieuwe functies of verbeteringen?">${esc(S.feedbackText)}</textarea>
          <button class="btn btn-primary btn-lg btn-block" data-a="sendFeedback">Versturen</button>
        </div>`);
    case 'help':
      return modal(`${mhead('Hulp vragen')}
        <div class="stack" style="margin-top:12px">
          <p class="muted" style="font-size:.9rem">Voer je naam in zodat de medewerker weet wie je bent.</p>
          <input id="helpName" class="input" data-m="helpName" data-enter="sendHelp" placeholder="Jouw naam" value="${esc(S.helpName)}" data-testid="input-help-name">
          <button class="btn btn-primary btn-lg btn-block" data-a="sendHelp" data-dis="help" data-testid="button-send-help">Stuur hulpverzoek</button>
        </div>`);
    case 'staffcode':
      return modal(`${mhead('Medewerker verificatie')}
        <div class="stack" style="margin-top:12px">
          <input id="staffCodeInput" type="password" inputmode="numeric" maxlength="4" class="input pin" data-m="staffCodeInput" data-enter="staffLogin" placeholder="••••" value="${esc(S.staffCodeInput)}" data-testid="input-staff-code" autocomplete="off">
          <button class="btn btn-primary btn-lg btn-block" data-a="staffLogin" data-testid="button-staff-login">Dashboard openen</button>
        </div>`);
    case 'spend': {
      const orders = myOrders();
      const price = o => (drinkByName(o.drink) || {}).priceInCents || 0;
      const total = orders.filter(o => o.status !== 'declined').reduce((s,o) => s + price(o), 0);
      const declTotal = orders.filter(o => o.status === 'declined').reduce((s,o) => s + price(o), 0);
      const anyPrices = orders.some(o => price(o) > 0);
      return modal(`${mhead('Uitgaven — ' + esc(S.name))}
        <div class="stack" style="margin-top:12px">
        ${orders.length === 0 ? '<p class="muted center" style="padding:24px 0">Nog geen bestellingen gevonden.</p>' : `
          <div class="dlist" style="max-height:280px;overflow:auto">
            ${orders.map(o => `<div class="row between" style="padding:8px 12px;border-radius:12px;background:${o.status === 'declined' ? 'var(--red-bg)' : 'var(--paper)'}">
              <div style="min-width:0"><b style="font-size:.92rem">${esc(o.drink)}</b>
                <div class="mono">${fmtDateTime(o.createdAt)}</div>${badge(o.status, true)}</div>
              ${anyPrices ? `<div style="text-align:right;flex:none"><b style="${o.status === 'declined' ? 'color:var(--red);text-decoration:line-through' : ''}">${price(o) > 0 ? fmtPrice(price(o)) : '—'}</b>
                ${o.status === 'declined' && price(o) > 0 ? '<div style="font-size:.66rem;color:var(--red);font-weight:700">Niet meegerekend</div>' : ''}</div>` : ''}
            </div>`).join('')}
          </div>
          ${anyPrices ? `<div class="sum pay"><span>Totaal te betalen</span><span>${fmtPrice(total)}</span></div>` : '<p class="muted center" style="font-size:.8rem">Er zijn nog geen prijzen ingesteld door de beheerder.</p>'}
          ${anyPrices && declTotal > 0 ? `<div class="row between" style="font-size:.76rem;color:var(--red);padding:0 4px"><span>Geweigerd — niet meegerekend</span><b>−${fmtPrice(declTotal)}</b></div>` : ''}`}
        </div>`);
    }
    case 'editOrder': {
      const dr = drinkByName(d.drink);
      const ice = dr ? dr.iceAvailable : 'off', bub = dr ? dr.bubblesAvailable : 'off';
      if (d.confirmDelete) return modal(`${mhead('Bestelling wijzigen')}
        <div class="stack" style="margin-top:12px">
          <div class="center" style="background:var(--red-bg);border-radius:16px;padding:18px"><div style="font-size:34px">🗑️</div><b>Bestelling verwijderen?</b><p class="muted" style="font-size:.85rem;margin-top:2px">Dit kan niet ongedaan worden gemaakt.</p></div>
          <button class="btn btn-danger btn-lg btn-block" data-a="deleteMyOrder">Ja, verwijder bestelling</button>
          <button class="btn btn-out btn-block" data-a="cancelDelete">Annuleren</button>
        </div>`, {wide:true});
      return modal(`${mhead('Bestelling wijzigen')}
        <div class="stack" style="margin-top:12px">
          <div class="field"><label>Drankje</label>
            <div class="grid" style="grid-template-columns:1fr 1fr;gap:6px;max-height:180px;overflow:auto;padding-right:2px">
              ${S.data.drinks.map(x => `<button type="button" class="btn btn-sm ${d.drink === x.name ? 'btn-primary' : 'btn-out'}" style="justify-content:flex-start" data-a="editPick" data-name="${esc(x.name)}">${emoji(x.icon)} ${esc(x.name)}</button>`).join('')}
            </div></div>
          ${(ice !== 'off' || bub !== 'off') ? `<div class="field"><label>Opties</label>
            <div class="opts ${ice !== 'off' && bub !== 'off' ? '' : 'one'}">
              ${ice !== 'off' ? tile({kind:'ice', mode:ice, on:d.ice, onAction:'editIce', big:'❄️', label:'IJsblokjes', onText:'Met ijs', offText:'Zonder ijs', lockedText:'Altijd inbegrepen'}) : ''}
              ${bub !== 'off' ? tile({kind:'bub', mode:bub, on:d.bubbles, onAction:'editBub', big:'🫧', label:'Bubbels', onText:'Met bubbels', offText:'Zonder bubbels', lockedText:'Altijd inbegrepen'}) : ''}
            </div></div>` : ''}
          <div class="field"><label>Opmerkingen (optioneel)</label>
            <input id="editNotes" class="input" data-m="editNotes" placeholder="Bijv. extra suiker..." value="${esc(d.notes)}"></div>
          <button class="btn btn-primary btn-lg btn-block" data-a="saveEdit">Wijzigingen opslaan</button>
          <button class="btn btn-ghost btn-block" style="color:var(--red)" data-a="askDelete">${ic('trash')} Bestelling verwijderen</button>
        </div>`, {wide:true});
    }
    case 'decline': {
      const o = S.data.orders.find(x => x.id === d.id);
      return modal(`${mhead('Bestelling weigeren')}
        <div class="stack" style="margin-top:12px">
          <p class="muted" style="font-size:.9rem">Geef aan waarom ${esc(o ? o.customerName : 'deze klant')}'s ${esc(o ? o.drink : 'bestelling')} wordt geweigerd.</p>
          <select id="declineChoice" class="select" data-m="declineChoice">
            <option value="">Kies een reden...</option>
            ${['Ik heb geen zin in jou', 'Vul je echte naam in', 'Ik heb geen tijd nu!'].map(r => `<option value="${esc(r)}" ${S.declineChoice === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
            <option value="custom" ${S.declineChoice === 'custom' ? 'selected' : ''}>Zelf een reden typen...</option>

          ${S.declineChoice === 'custom' ? `<input id="declineCustom" class="input" data-m="declineCustom" maxlength="200" placeholder="Typ je reden..." value="${esc(S.declineCustom)}">` : ''}
          <button class="btn btn-danger btn-lg btn-block" data-a="confirmDecline" data-dis="decline">Bestelling weigeren</button>
        </div>`);
    }
    case 'forgot':
      return modal(`${mhead('Code vergeten?')}
        <div class="stack" style="margin-top:12px">
          <p class="muted" style="font-size:.92rem">Alle beheerders die meldingen hebben aangezet, krijgen een melding waarin de code staat. Dit werkt zolang de app open staat op hun apparaat.</p>
          <button class="btn btn-primary btn-block btn-lg" data-a="sendCodeRequest" data-testid="button-send-code-request">Stuur de code naar de beheerders</button>
          <button class="btn btn-out btn-block" data-a="closeDialog">Annuleren</button>
        </div>`);
  }
  return extraDialogHTML(d);
}

function homeBody() {
  const cfg = S.data.config, drinks = S.data.drinks;
  if (cfg.orderingOpen === false) return `<div class="gate closed"><div class="box">
      <div class="disc">🚫</div><h2>Bestellen is momenteel niet mogelijk</h2>
      <p>De bestellingen zijn tijdelijk gesloten. Probeer het later opnieuw.</p></div></div>`;
  if (!S.nameConfirmed) return `<div class="gate"><div class="box">
      <div class="big">${ic('cup')}</div>
      <h2>Welkom bij ${esc(cfg.cafeName)}!</h2>
      <p>Hoe heet jij? Dan weten we voor wie we het drankje maken.</p>
      <div class="stack">
        <input id="gateName" class="input center" style="min-height:52px;font-size:1.05rem" data-m="nameDraft" data-enter="confirmName" placeholder="Jouw naam" value="${esc(S.nameDraft)}" data-testid="input-name-gate" autocomplete="given-name">
        <button class="btn btn-primary btn-lg btn-block" data-a="confirmName" data-dis="gate" data-testid="button-confirm-name">Verder</button>
        <p class="muted" style="font-size:.8rem">We gebruiken je naam alleen voor je bestelling. <a href="privacybeleid.html" style="color:var(--violet);font-weight:700">Privacybeleid</a></p>
      </div></div></div>`;

  const uniqueIcons = [...new Set(drinks.map(d => d.icon || 'CupSoda'))];
  const source = (!S.mostOrdered && S.filters.length) ? drinks.filter(d => S.filters.includes(d.icon || 'CupSoda')) : drinks;
  let groups;
  if (S.mostOrdered) {
    const ordered = source.filter(d => (S.orderCounts[d.id] || 0) > 0).sort((a,b) => (S.orderCounts[b.id] || 0) - (S.orderCounts[a.id] || 0));
    groups = ordered.length ? [{key:'__most__', label:'Meest besteld', special:true, drinks:ordered}] : [];
  } else {
    groups = [...new Set(source.map(d => d.icon || 'CupSoda'))].map(icon => ({key:icon, label:ICON_DISPLAY[icon] || icon, drinks:source.filter(d => (d.icon || 'CupSoda') === icon)}));
  }
  const hasHistory = Object.keys(S.orderCounts).length > 0;
  return `<div class="scroll" id="scroller"><div class="wrap">
    <div class="hello"><h2>Wat zal het zijn?</h2><p>Kies je drankje</p></div>
    <div class="stack">
      <div class="field"><label for="name">Wat is uw naam?</label>
        <input id="name" class="input" data-m="name" placeholder="Voer naam in" value="${esc(S.name)}" data-testid="input-name"></div>
      <div class="field"><label for="notes">Speciale verzoeken (optioneel)</label>
        <input id="notes" class="input" data-m="notes" placeholder="Bijv. extra suiker, havermelk..." value="${esc(S.notes)}" data-testid="input-notes"></div>

    ${(uniqueIcons.length > 1 || hasHistory) ? `<div class="filters">
      ${hasHistory ? `<button type="button" class="chip ${S.mostOrdered ? 'on' : ''}" data-a="filterMost" data-testid="filter-most-ordered">⭐ Meest besteld</button>` : ''}
      ${uniqueIcons.length > 1 ? `<button type="button" class="chip ${!S.mostOrdered && !S.filters.length ? 'on' : ''}" data-a="filterAll">Alle</button>
        ${uniqueIcons.map(i => `<button type="button" class="chip ${!S.mostOrdered && S.filters.includes(i) ? 'on' : ''}" data-a="filterIcon" data-icon="${esc(i)}" title="${esc(ICON_DISPLAY[i] || i)}" aria-label="${esc(ICON_DISPLAY[i] || i)}">${emoji(i)}</button>`).join('')}` : ''}
    </div>` : ''}
    ${groups.map(g => `<section>
      ${groups.length > 1 ? `<p class="group-title ${g.special ? 'star' : ''}">${g.special ? '⭐ ' : ''}${esc(g.label)}</p>` : '<div style="height:10px"></div>'}
      <div class="grid">${g.drinks.map(d => {
        const sel = S.selected.some(s => s.drinkId === d.id);
        return `<button type="button" class="drink ${sel ? 'sel' : ''}" data-a="pickDrink" data-id="${d.id}">
          <span class="em">${emoji(d.icon)}</span><span class="nm">${esc(d.name)}</span>
          ${d.priceInCents > 0 ? `<span class="pr">${fmtPrice(d.priceInCents)}</span>` : ''}
          ${sel ? `<span class="tick">${ic('check')}</span>` : ''}</button>`;
      }).join('')}</div></section>`).join('')}
    ${S.mostOrdered && !groups.length ? '<p class="muted center" style="padding:30px 0">Je hebt nog niets besteld.</p>' : ''}
    ${!drinks.length ? '<p class="muted center" style="padding:30px 0">Er zijn nog geen drankjes. Voeg ze toe in het medewerker-dashboard.</p>' : ''}
  </div></div>
  ${cfg.multiDrinkMode === 'on' ? `<div class="bar"><button class="btn btn-primary btn-lg" data-a="placeOrder" data-dis="basket" data-testid="button-place-order">
      ${S.placing ? 'Plaatsen...' : `Bestelling plaatsen ${S.selected.length ? `<span class="count" style="background:#fff;color:var(--violet)">${S.selected.length}</span>` : ''}`}</button></div>` : ''}`;
}

/* ════════════════════════════════════════════════════════════════
   DE BAR: slot, toegang, bar-aanvragen en hoofdadmin
   ════════════════════════════════════════════════════════════════ */
const rp = (sub = '') => sub || '/';
const hrefRoom = (sub = '') => '#' + rp(sub);
const inWindow = c => {
  const n = Date.now(), s = c.sessionStart ? Date.parse(c.sessionStart) : null, e = c.sessionEnd ? Date.parse(c.sessionEnd) : null;
  return (s === null || n >= s) && (e === null || n <= e);
};
const roomVisible = c => !!c && !c.locked && inWindow(c);
const sessionOk = (c, iso) => !c.sessionStart || Date.parse(iso) >= Date.parse(c.sessionStart);
const overlaps = (a0, a1, b0, b1) => Date.parse(a0) < Date.parse(b1) && Date.parse(b0) < Date.parse(a1);

function myAccessRow() {
  const c = S.data.config, d = getDeviceId();
  return (S.data.access || []).filter(a => a.deviceId === d && sessionOk(c, a.createdAt)).sort((a, b) => b.id - a.id)[0];
}
function isHost() {
  const d = getDeviceId();
  return (S.data.roomRequests || []).some(r => r.deviceId === d && r.status === 'approved' && inWindow({sessionStart:r.startAt, sessionEnd:r.endAt}));
}
function hasAccess() {
  const c = S.data.config; if (!c || !c.requireApproval) return true;
  if (readSession() || readMain() || isHost()) return true;
  const r = myAccessRow(); return !!r && r.status === 'approved';
}
async function ensureAccess() {      // nieuwe bezoeker: vraag toegang aan als dat nodig is
  const c = S.data.config;
  if (!c || !S.nameConfirmed || !roomVisible(c) || !c.requireApproval || hasAccess() || myAccessRow()) return;
  try { await DB.createAccess(S.name, getDeviceId()); await refresh(); } catch (e) { fail(e); }
}

const secretBtn = (inDrawer = false) => `<button class="secret ${inDrawer ? 'in-drawer' : ''}" data-a="secretTap" tabindex="-1" aria-hidden="true" data-testid="secret-button${inDrawer ? '-drawer' : ''}"></button>`;

function myRequestsHTML() {
  const mine = (S.data.roomRequests || []).filter(r => r.status === 'pending' || Date.parse(r.endAt) > Date.now() - 864e5).sort((a, b) => b.id - a.id);
  if (!mine.length) return '';
  const st = {pending:['b-pending', 'In afwachting'], approved:['b-ready', 'Goedgekeurd'], denied:['b-declined', 'Niet goedgekeurd'], stopped:['b-served', 'Stopgezet']};
  return `<div class="card" style="margin-top:16px;text-align:left"><h3>Mijn aanvragen</h3><div class="dlist">
    ${mine.map(r => `<div class="fb" style="flex-direction:column;gap:6px;align-items:stretch">

/* onthoud op dit apparaat de code, zodat bij 'code vergeten' een melding met de code getoond kan worden */
const rememberCode = code => { if (code && code !== '__main__' && notifyEnabled()) lsSet('notifyCode', code); };
const notifyRooms = () => lsJson('notifyRooms', []);
const notifyEnabled = (room = S.roomId) => ('Notification' in window) && Notification.permission === 'granted' && notifyRooms().includes(room);
const pushStatus = () => !('Notification' in window) ? 'unsupported' : Notification.permission === 'denied' ? 'denied' : notifyEnabled() ? 'on' : 'off';

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880; g.gain.value = .15;
    o.connect(g); g.connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .5); o.stop(ctx.currentTime + .5);
  } catch {}
}
async function notify(title, body) {
  title = tr(title); body = tr(body);
  try {
    const reg = ('serviceWorker' in navigator) ? await navigator.serviceWorker.getRegistration() : null;
    if (reg && reg.showNotification) await reg.showNotification(title, {body, tag:'order-' + Date.now(), vibrate:[200,100,200], requireInteraction:true, icon:'icon-192.png', data:{url:'./#/staff'}});
    else new Notification(title, {body, icon:'icon-192.png'});
  } catch { try { new Notification(title, {body}); } catch {} }
  beep();
}
function detectNewOrders(next) {
  const staff = S.route.path === '/staff' && readSession() && notifyEnabled();
  if (S.knownIds && staff) {
    next.orders.filter(o => !S.knownIds.has(o.id) && o.status === 'pending')
      .forEach(o => notify('Nieuwe bestelling!', `${o.customerName} bestelde ${o.drink}.`));
  }
  if (S.knownAccess && staff) {
    (next.access || []).filter(a => !S.knownAccess.has(a.id) && a.status === 'pending')
      .forEach(a => notify('Toegangsverzoek', `${a.personName} wil naar binnen.`));
  }
  S.knownIds = new Set(next.orders.map(o => o.id));
  S.knownAccess = new Set((next.access || []).map(a => a.id));
}

function detectWatch() {
  if (S.route.query && 'watch' in S.route.query) return true;
  const ua = navigator.userAgent;
  if (/SM-R\d{3}/i.test(ua) || /wearable|wear[\s-]?os/i.test(ua)) return true;
  if (screen.width <= 500 && screen.height <= 500) return true;
  return innerWidth > 0 && innerWidth <= 500 && innerHeight <= 500;
}
const W_NEXT = {pending:'making', making:'ready', ready:'served'};
const W_LABEL = {pending:'Wacht op bereiding', making:'Aan het maken', ready:'Klaar om te leveren'};
const W_ACTION = {pending:'Begin', making:'Klaar', ready:'Afleveren'};
const W_COLOR = {pending:'#f59e0b', making:'#3b82f6', ready:'#22c55e'};
const watchOrders = () => S.data.orders.filter(o => o.status !== 'served' && o.status !== 'declined').sort((a,b) => a.id - b.id);

function watchFace() {
  if (!S.w.auth) {
    const rows = [['1','2','3'],['4','5','6'],['7','8','9'],['←','0','']];
    return `<div class="abs" style="padding-top:52px">
      <p style="color:#ffffff77;font-size:11px;letter-spacing:.08em;margin-bottom:10px">${esc(S.data.config.cafeName)}</p>
      <div class="dots ${S.w.err ? 'err' : ''}">${[0,1,2,3].map(i => `<i class="${i < S.w.pin.length ? 'f' : ''}"></i>`).join('')}</div>
      <div class="keys">${rows.flat().map(b => b === '' ? '<div></div>' : `<button class="key ${b === '←' ? 'del' : ''}" data-a="${b === '←' ? 'wDelete' : 'wDigit'}" data-d="${b}">${b}</button>`).join('')}</div></div>`;
  }
  const list = watchOrders(), o = list[0];
  if (!o) return `<div class="abs" style="justify-content:center"><div style="font-size:40px;opacity:.2;margin-bottom:10px">☕</div><p style="color:#ffffff44;font-size:13px">Geen bestellingen</p></div>`;
  const c = W_COLOR[o.status];
  return `<div class="abs wcard" data-a="wAdvance">
    ${list.length > 1 ? `<div style="position:absolute;top:70px;display:flex;gap:5px">${list.slice(0,8).map((_,i) => `<div style="width:${i === 0 ? 14 : 5}px;height:5px;border-radius:3px;background:${i === 0 ? '#fff' : '#333'}"></div>`).join('')}</div>` : ''}
    <p style="color:${c};font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:10px">${W_LABEL[o.status]}</p>
    <p style="font-size:28px;font-weight:800;text-align:center;max-width:240px;line-height:1.15;margin-bottom:4px">${esc(o.drink)}</p>
    <p style="color:#888;font-size:13px;font-weight:500;margin-bottom:20px">${esc(o.customerName)}</p>
    ${(o.withIce || o.withBubbles) ? `<div style="display:flex;gap:6px;margin-bottom:12px">
      ${o.withIce ? '<span style="font-size:10px;color:#93c5fd;background:#1e3a5f;border-radius:8px;padding:2px 8px;font-weight:600">❄ Ijs</span>' : ''}
      ${o.withBubbles ? '<span style="font-size:10px;color:#86efac;background:#14532d;border-radius:8px;padding:2px 8px;font-weight:600">◉ Bubbels</span>' : ''}</div>` : ''}
    <div style="padding:9px 22px;border-radius:24px;background:${c}20;border:1.5px solid ${c}55"><span style="color:${c};font-size:14px;font-weight:700">${W_ACTION[o.status]} →</span></div>
    ${list.length > 1 ? `<p style="position:absolute;bottom:68px;color:#555;font-size:10px">1 van ${list.length}</p>` : ''}
  </div>`;
}
function viewWatch() {
  if (detectWatch()) {
    const sc = Math.min(innerWidth, innerHeight) / 360;
    return `<div class="watch-fixed"><div class="face" style="transform:scale(${sc})">${watchFace()}</div></div>`;
  }
  return `<div class="watch-page"><div class="bezel"><div class="face">${watchFace()}</div></div>
    <p style="color:#555;font-size:11px;letter-spacing:.1em;font-weight:500">Voorbeeld horlogescherm</p>
    <a href="${hrefRoom()}" style="color:#666;font-size:12px">← Terug naar bestellen</a></div>`;
}

/* ════════════════════════════════════════════════════════════════
   9. ACTIES (alles wat je kunt aantikken)
   ════════════════════════════════════════════════════════════════ */
const root = $('#app');
const go = path => { location.hash = '#' + path; };
const cfgNow = () => S.data.config;
const confirmed = msg => window.confirm(tr(msg));
const snapOpts = () => ({staff:S.route.path === '/staff', main:S.route.path === '/main', deviceId:getDeviceId()});

async function refresh() {            // na een eigen actie: gegevens verversen en direct tekenen
  const snap = await DB.getSnapshot(snapOpts());
  S.sig = JSON.stringify(snap); S.data = snap;
  detectNewOrders(snap); syncSession(); render();
}
function syncSession() {      // hoofdadmin-sessie moet nog geldig zijn
  if (S.session === '__main__' && !readMain()) { clearSession(); S.session = null; }
}
async function verifySession() {   // klopt de code nog? (de hoofdadmin kan hem gewijzigd hebben)
  if (!S.session || S.session === '__main__') return;
  let ok = true; try { ok = await DB.checkStaffCode(S.session); } catch {}
  if (!ok) { clearSession(); S.session = null; }
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { fail(e); } };

const incrementOrderCount = ids => {
  for (const id of ids) S.orderCounts[id] = (S.orderCounts[id] || 0) + 1;
  lsSet('orderCounts', JSON.stringify(S.orderCounts));
};
const joinNames = names => names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} en ${names[1]}` : `${names.slice(0,-1).join(', ')} en ${names[names.length-1]}`;

async function submitOrders(list) {
  const name = S.name.trim();
  if (!name) { toast('Voer eerst uw naam in', '', true); return; }
  if (S.data.config.orderingOpen === false) { toast('Bestellen is gesloten', '', true); return; }
  if (S.placing) return;
  let deviceId = lsGet('deviceId'); if (!deviceId) { deviceId = uid(); lsSet('deviceId', deviceId); }
  S.placing = true; render();
  try {
    for (const d of list) {
      const o = await DB.createOrder({customerName:name, drink:d.name, notes:S.notes, deviceId, withIce:d.withIce, withBubbles:d.withBubbles});
      if (S.knownIds) S.knownIds.add(o.id);
    }
  } catch (e) { S.placing = false; fail(e); render(); return; }
  S.placing = false;
  incrementOrderCount(list.map(d => d.drinkId));
  const names = list.map(d => d.name);
  toast('Bestelling geplaatst!', names.length === 1 ? `Je ${names[0]} wordt bereid.` : `Je ${joinNames(names)} worden bereid.`);
  S.notes = ''; S.selected = [];
  try { const snap = await DB.getSnapshot(snapOpts()); S.sig = JSON.stringify(snap); S.data = snap; } catch {}
  go(rp('/track?name=' + encodeURIComponent(name)));
}

const openDialog = (dlg, focusId) => { S.dialog = dlg; S.menuOpen = false; S.animate = true; if (focusId) S.focusId = focusId; render(); };

const ACTIONS = {
  /* algemeen */
  backdrop(el, e) { if (e.target !== el) return; if (el.dataset.close === 'menu') S.menuOpen = false; else S.dialog = null; render(); },
  closeDialog() { S.dialog = null; render(); },
  openMenu() { S.menuOpen = true; S.animate = true; render(); },
  closeMenu() { S.menuOpen = false; render(); },
  dismissDecline(el) {
    S.dismissed.add(+el.dataset.id); lsSet('dismissedDeclines', JSON.stringify([...S.dismissed])); render();
  },
  blurSelf(el) { el.blur(); },

  /* klant: naam & menu */
  changeName() { S.name = ''; S.nameDraft = ''; S.nameConfirmed = false; S.menuOpen = false; S.focusId = 'gateName'; render(); },
  confirmName() {
    const t = S.nameDraft.trim(); if (!t) return;
    S.name = t; S.helpName = t; S.nameConfirmed = true; lsSet('customerName', t); render(); ensureAccess();
  },
  openFeedback() { openDialog({type:'feedback'}, 'feedbackText'); },
  sendFeedback: run(async () => {
    await DB.createFeedback(S.feedbackText);
    S.feedbackText = ''; S.dialog = null; toast('Bedankt voor je feedback!'); await refresh();
  }),
  openHelp() { if (S.name.trim()) S.helpName = S.name; openDialog({type:'help'}, 'helpName'); },
  sendHelp: run(async () => {
    if (!S.helpName.trim()) return;
    await DB.createHelpRequest(S.helpName);
    S.dialog = null; toast('Hulpverzoek verstuurd', 'Een medewerker komt naar je toe.'); await refresh();
  }),
  openSpend() { openDialog({type:'spend'}); },
  openStaff() { S.staffCodeInput = ''; openDialog({type:'staffcode'}, 'staffCodeInput'); },
  staffLogin: run(async () => {
    if (await DB.checkStaffCode(S.staffCodeInput)) {
      rememberCode(S.staffCodeInput);
      writeSession(S.staffCodeInput); S.session = S.staffCodeInput; S.dialog = null; S.menuOpen = false; S.staffCodeInput = '';
      go(rp('/staff'));
    } else toast('Ongeldige toegangscode', '', true);
  }),

  /* klant: drankjes kiezen */
  filterMost() { S.mostOrdered = !S.mostOrdered; S.filters = []; render(); },
  filterAll() { S.mostOrdered = false; S.filters = []; render(); },
  filterIcon(el) {
    const i = el.dataset.icon; S.mostOrdered = false;
    S.filters = S.filters.includes(i) ? S.filters.filter(x => x !== i) : [...S.filters, i]; render();
  },
  pickDrink(el) {
    const d = drinkById(+el.dataset.id); if (!d) return;
    const multi = cfgNow().multiDrinkMode === 'on';
    if (multi && S.selected.some(s => s.drinkId === d.id)) { S.selected = S.selected.filter(s => s.drinkId !== d.id); render(); return; }
    if (!multi && !S.name.trim()) { toast('Voer eerst uw naam in', '', true); S.focusId = 'name'; render(); return; }
    if (d.iceAvailable === 'off' && d.bubblesAvailable === 'off') {
      const item = {drinkId:d.id, name:d.name, icon:d.icon, withIce:false, withBubbles:false};
      if (!multi) submitOrders([item]); else { S.selected.push(item); render(); }
      return;
    }
    openDialog({type:'options', drinkId:d.id, ice:d.iceAvailable === 'locked', bubbles:d.bubblesAvailable === 'locked'});
  },
  toggleIce() { S.dialog.ice = !S.dialog.ice; render(); },
  toggleBub() { S.dialog.bubbles = !S.dialog.bubbles; render(); },
  optsConfirm() {
    const dr = drinkById(S.dialog.drinkId); if (!dr) { S.dialog = null; render(); return; }
    const withIce = dr.iceAvailable === 'locked' ? true : dr.iceAvailable === 'off' ? false : S.dialog.ice;
    const withBubbles = dr.bubblesAvailable === 'locked' ? true : dr.bubblesAvailable === 'off' ? false : S.dialog.bubbles;
    S.dialog = null;
    const item = {drinkId:dr.id, name:dr.name, icon:dr.icon, withIce, withBubbles};
    if (cfgNow().multiDrinkMode !== 'on') { submitOrders([item]); return; }
    const i = S.selected.findIndex(s => s.drinkId === dr.id);
    if (i >= 0) S.selected[i] = item; else S.selected.push(item);
    render();
  },
  placeOrder() { if (S.selected.length) submitOrders([...S.selected]); },

  /* klant: bestelling volgen/wijzigen */
  editOrder(el) {
    const o = S.data.orders.find(x => x.id === +el.dataset.id); if (!o) return;
    openDialog({type:'editOrder', id:o.id, drink:o.drink, ice:o.withIce, bubbles:o.withBubbles, notes:o.notes || '', confirmDelete:false});
  },
  editPick(el) {
    const d = drinkByName(el.dataset.name);
    S.dialog.drink = el.dataset.name;
    S.dialog.ice = d ? d.iceAvailable === 'locked' : false; S.dialog.bubbles = d ? d.bubblesAvailable === 'locked' : false;
    render();
  },
  editIce() { S.dialog.ice = !S.dialog.ice; render(); },

    if (e - s > 864e5 + 6e4) throw new Error('Een feest kan maximaal 24 uur duren.');
    if (e <= new Date()) throw new Error('De eindtijd ligt al in het verleden.');
    await DB.createRoomRequest({firstName:f.name, email:f.email, code:f.code, startAt:s.toISOString(), endAt:e.toISOString(), requireApproval:f.approval, deviceId:getDeviceId()});

   10. TEKENEN, ROUTES EN OPSTARTEN
   ════════════════════════════════════════════════════════════════ */
const notFound = () => `<div class="gate"><div class="box"><div class="big">🤷</div><h2>Pagina niet gevonden</h2><p>Deze pagina bestaat niet.</p><a class="btn btn-primary btn-lg" href="#/">Naar de drankjes</a></div></div>`;
function view() {
  const p = S.route.path, c = S.data.config;
  if (p === '/main') return viewMain();
  if (p === '/staff') return viewStaff();
  if (p === '/watch') return viewWatch();
  if (p === '/' || p === '/track') {
    if (!roomVisible(c) && !readSession() && !readMain()) return viewLocked();
    if (S.nameConfirmed && !hasAccess()) return viewAccess();
    return p === '/' ? viewHome() : viewTrack();
  }
  return notFound();
}

function render(resetScroll = false) {
  if (!S.data) return;
  const ae = document.activeElement;
  const keep = ae && ae.id && root.contains(ae) ? {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd} : null;
  const sc = $('#scroller'), st = sc ? sc.scrollTop : 0;
  const md = $('.modal'), mt = md ? md.scrollTop : 0;
  root.className = S.animate ? 'anim' : ''; S.animate = false;
  root.innerHTML = view();
  translateDom(root);
  const sc2 = $('#scroller'); if (sc2 && !resetScroll) sc2.scrollTop = st;
  const md2 = $('.modal'); if (md2 && md) md2.scrollTop = mt;
  const target = S.focusId || (keep && keep.id);
  if (target) {
    const el = document.getElementById(target);
    if (el) {
      el.focus({preventScroll:!S.focusId});
      try { if (S.focusId) el.setSelectionRange(el.value.length, el.value.length); else if (keep && keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch {}
    }
  }
  S.focusId = null; S.pendingRender = false;
  applyDisabled();
  lastVisible = visibleNow(); scheduleBoundary();
}

/* sluit/open de bar precies op het moment dat het tijdslot eindigt/begint, zonder verversen */
let lastVisible = null, boundaryTimer = null;
const visibleNow = () => (S.data && S.data.config) ? roomVisible(S.data.config) : null;
function checkBoundary() {
  if (!S.data || S.dragging || !['/', '/track', '/main'].includes(S.route.path)) return;
  const v = visibleNow();
  if (v !== null && lastVisible !== null && v !== lastVisible) render();
}
function scheduleBoundary() {
  clearTimeout(boundaryTimer);
  const c = S.data && S.data.config; if (!c) return;
  const now = Date.now();
  const next = [c.sessionStart, c.sessionEnd].filter(Boolean).map(Date.parse).filter(t => t > now).sort((x, y) => x - y)[0];
  if (next && next - now < 2147000000) boundaryTimer = setTimeout(function () { checkBoundary(); scheduleBoundary(); }, next - now + 300);
}
function softRender() {          // voor automatische updates: nooit het typen verstoren
  if (S.dragging) { S.pendingRender = true; return; }
  const ae = document.activeElement;
  if (ae && root.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) {
    if (S.route.path === '/track' && ae.id === 'trackName') updateTrackResults(); else S.pendingRender = true;
    return;
  }
  render();
}
let routeTok = 0;
async function reload() {
  if (!S.data) return;
  const tok = routeTok;
  let kicked = false;
  if (S.route.path === '/staff' && S.session && S.session !== '__main__') {   // code intussen gewijzigd?
    await verifySession(); kicked = !S.session;
  }
  const snap = await DB.getSnapshot(snapOpts()), sig = JSON.stringify(snap);
  if (tok !== routeTok || (sig === S.sig && !kicked)) return;
  S.sig = sig; S.data = snap;
  detectNewOrders(snap); syncSession();
  softRender();
}

function showFatal(e) {
  root.innerHTML = `<div class="gate"><div class="box"><div class="big">📡</div><h2>Geen verbinding</h2><p>${esc(e.message)}</p><button class="btn btn-primary btn-lg" onclick="location.reload()">Opnieuw proberen</button></div></div>`;
  translateDom(root);
}

async function onRoute() {
  const tok = ++routeTok;
  const h = location.hash.replace(/^#/, '') || '/';
  const [path0, qs] = h.split('?');
  const path = path0 || '/';
  if (!['/', '/track', '/staff', '/watch', '/main'].includes(path)) { location.replace('#/'); return; }
  S.route = {path, query:Object.fromEntries(new URLSearchParams(qs || ''))};
  S.menuOpen = false; S.dialog = null;
  try {
    const snap = await DB.getSnapshot(snapOpts());
    if (tok !== routeTok) return;
    S.data = snap; S.sig = JSON.stringify(snap);
    S.knownIds = new Set(snap.orders.map(o => o.id)); S.knownAccess = new Set((snap.access || []).map(a => a.id));
  } catch (e) { if (tok === routeTok) showFatal(e); return; }
  if (path === '/staff') { S.session = readSession(); await verifySession(); if (tok !== routeTok) return; }
  if (path === '/main' && !readMain()) return go('/');
  if (path === '/track' && !S.nameConfirmed) return go('/');
  if (path === '/track') { S.trackName = S.route.query.name || ''; S.trackQuery = S.trackName; }
  if (path === '/watch') S.w = {pin:'', auth:false, code:'', err:false};
  syncSession();
  document.title = tr(({'/':'Café Bestellingen', '/track':'Bestelling volgen', '/staff':'Medewerker', '/watch':'Horloge', '/main':'Hoofdadmin'})[path]);
  render(true);
  ensureAccess();
}
