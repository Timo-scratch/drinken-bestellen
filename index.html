async function initCodeReqLast() {
  const r = await sb('code_requests?select=id&order=id.desc&limit=1');
  lsSet('codeReqLast', String(r.length ? r[0].id : 0));
}
let bgBusy = false;
async function bgWatch() {
  if (bgBusy || !('Notification' in window) || Notification.permission !== 'granted') return;
  bgBusy = true;
  try {
    if (notifyRooms().length) {
      const last = lsGet('codeReqLast');
      const rows = await sb('code_requests?select=id&order=id.desc&limit=5');
      const top = rows.length ? rows[0].id : 0;
      if (last === null) lsSet('codeReqLast', String(top));
      else {
        const fresh = rows.filter(r => r.id > +last).sort((a, b) => a.id - b.id);
        if (top > +last) lsSet('codeReqLast', String(top));
        if (fresh.length) {
          const name = ((await sb('config?id=eq.1&select=cafe_name'))[0] || {}).cafe_name || '';
          const known = lsGet('notifyCode');
          const ok = known ? await DB.checkStaffCode(known).catch(() => false) : false;
          for (const _ of fresh) await notify('Code vergeten', ok ? `De code van ${name} is ${known}.` : `Iemand vroeg de code van ${name} op, maar deze is gewijzigd. Vraag de hoofdadmin om de code.`);
        }
      }
    }
    if (custNotifyOn()) {
      const rows = await sb(`orders?device_id=eq.${enc(getDeviceId())}&status=eq.declined&select=id,drink,decline_reason`);
      const seen = lsJson('declNotified', null);
      if (seen === null) lsSet('declNotified', JSON.stringify(rows.map(r => r.id)));
      else {
        const fresh = rows.filter(r => !seen.includes(r.id));
        if (fresh.length) {
          lsSet('declNotified', JSON.stringify([...seen, ...fresh.map(r => r.id)]));
          for (const r of fresh) await notify('Bestelling geweigerd', r.decline_reason ? `Je ${r.drink} is geweigerd: ${r.decline_reason}` : `Je ${r.drink} is geweigerd.`);
        }
      }
    }
  } catch {} finally { bgBusy = false; }
}

/* taal: bepaald door de taal/tijdzone van het apparaat (geen gegevens naar derden); handmatig wisselen kan altijd */
function detectLang() {}

/* gebeurtenissen */
root.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || !root.contains(el)) return;
  const fn = ACTIONS[el.dataset.a]; if (fn) fn(el, e);
});
root.addEventListener('input', e => {
  const el = e.target, m = el.dataset && el.dataset.m;
  if (m && MODELS[m]) { MODELS[m](el.value, el); applyDisabled(); }
});
root.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.enter && el.tagName !== 'TEXTAREA') { e.preventDefault(); ACTIONS[el.dataset.enter](el, e); }
  if (e.key === 'Escape') {
    if (S.editPriceId != null) { S.editPriceId = null; render(); }
    else if (S.dialog) { S.dialog = null; render(); }
    else if (S.menuOpen) { S.menuOpen = false; render(); }
  }
});
root.addEventListener('focusout', e => {
  const b = e.target.dataset && e.target.dataset.blur;
  if (b && ACTIONS[b]) ACTIONS[b](e.target, e);
  if (S.pendingRender) setTimeout(() => {
    const a = document.activeElement;
    if (!(a && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
  }, 0);
});

/* drankjes slepen om de volgorde te wijzigen */
let drag = null;
root.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-drag]'); if (!g) return;
  const rows = [...root.querySelectorAll('#drinklist .drow')], row = g.closest('.drow'), idx = rows.indexOf(row);
  if (idx < 0) return;
  const rects = rows.map(r => r.getBoundingClientRect());
  drag = {row, rows, idx, over:idx, startY:e.clientY, rects, h:rects[idx].height + 8};
  S.dragging = true; row.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.startY;
  drag.row.style.transform = `translateY(${dy}px)`;
  const c = drag.rects[drag.idx].top + drag.rects[drag.idx].height / 2 + dy, last = drag.rects.length - 1;
  let over = drag.idx;
  drag.rects.forEach((r, i) => { if (c >= r.top && c <= r.bottom) over = i; });
  if (c < drag.rects[0].top) over = 0;
  if (c > drag.rects[last].bottom) over = last;
  drag.over = over;
  drag.rows.forEach((r, i) => {
    if (r === drag.row) return;
    const shift = (drag.idx < over && i > drag.idx && i <= over) ? -drag.h : (drag.idx > over && i < drag.idx && i >= over) ? drag.h : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
});
async function endDrag(commit) {
  if (!drag) return;
  const {idx, over} = drag; drag = null;
  root.querySelectorAll('#drinklist .drow').forEach(r => { r.style.transform = ''; r.classList.remove('dragging'); });
  if (commit && over !== idx) {
    const ids = S.data.drinks.map(d => d.id); const [m] = ids.splice(idx, 1); ids.splice(over, 0, m);
    try { await DB.reorderDrinks(ids); } catch (err) { fail(err); }
  }
  S.dragging = false; await refresh();
}
window.addEventListener('pointerup', () => endDrag(true));
window.addEventListener('pointercancel', () => endDrag(false));

/* opstarten */
async function boot() {
  document.documentElement.lang = S.lang;
  root.innerHTML = `<div class="gate"><div class="box"><div class="big">${ic('cup')}</div><p>Laden…</p></div></div>`; translateDom(root);
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('resize', () => { if (S.route.path === '/watch') render(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    checkBoundary();
    if (S.route.path === '/staff') {
      const v = readSession();
      if (!v) { clearSession(); S.session = null; render(); } else writeSession(v);
    }
    reload().catch(() => {});
  });
  let tick = 0;
  setInterval(() => {
    reload().catch(() => {}); bgWatch(); checkBoundary();
    if (tick % 5 === 0) DB.applyDueSessions().catch(() => {});
    if (++tick % 20 === 0 && S.route.path === '/' && S.data) softRender();
  }, 3000);
  const after = sessionStorage.getItem('toastAfter'); if (after) { sessionStorage.removeItem('toastAfter'); toast(after); }
  detectLang();
  DB.applyDueSessions().catch(() => {});
  await onRoute();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
</script>
